var view='home',selected=null,weekOffset=0,ticker=null,suppressClick=false,audio=null,toastTimer=null;

function blank(){return {muscleIcons:{},records:{},deleted:[],exerciseOrder:[],workoutTypes:DEFAULT_TYPES.slice(),workoutDays:{},muscles:{},dayMuscles:{},muscleGroups:DEFAULT_MUSCLES.slice(),increase:{},training:{},performed:{},performedAt:{},timer:{},lastTimerExercise:""};}
function load(){var s=blank();try{var raw=localStorage.getItem(KEY);if(raw){var parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')Object.assign(s,parsed);}}catch(e){}return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){toast('השמירה נכשלה. נסה שוב.');return false;}}

function pad(n){return (n<10?'0':'')+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return dateKey(new Date());}
function sundayOf(d){var c=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);c.setDate(c.getDate()-c.getDay());return c;}
function shortDate(d){return d.getDate()+'/'+(d.getMonth()+1);}
function clamp(v,a,b){v=parseInt(v,10);if(isNaN(v))v=a;return Math.max(a,Math.min(b,v));}
function secondsLeft(deadline,now){return Math.max(0,Math.min(300,Math.ceil((deadline-now)/1000)));}
function timeText(s){return pad(Math.floor(s/60))+':'+pad(s%60);}

 function press(x,y,row){sx=x;sy=y;clearTimeout(timer);timer=setTimeout(function(){timer=null;begin(row,x,y);},450);}
 function begin(row,x,y){if(rows().length<2){toast('צריך לפחות שני פריטים כדי לשנות סדר');return;}dragging=row;startOrder=rows().map(function(r){return r.dataset.name;});var b=row.getBoundingClientRect();ox=x-b.left;oy=y-b.top;clone=row.cloneNode(true);clone.classList.add('drag-clone');clone.style.width=b.width+'px';clone.style.height=b.height+'px';clone.style.left=b.left+'px';clone.style.top=b.top+'px';document.body.appendChild(clone);suppressClick=true;lastY=y;vibrate(30);}
 function move(x,y,e){if(timer){if(Math.abs(x-sx)>8||Math.abs(y-sy)>8){clearTimeout(timer);timer=null;}return;}if(!dragging)return;if(e&&e.cancelable)e.preventDefault();lastY=y;clone.style.left=(x-ox)+'px';clone.style.top=(y-oy)+'px';shift(y);var edge=90;auto=y<edge?-7:(y>window.innerHeight-edge?7:0);if(auto&&!raf)raf=requestAnimationFrame(step);}
 function step(){raf=null;if(!dragging||!auto)return;window.scrollBy(0,auto);shift(lastY);raf=requestAnimationFrame(step);}
 function shift(y){var rs=rows();var cur=rs.indexOf(dragging);if(cur<0)return;var centers=rs.map(function(r){var b=r.getBoundingClientRect();return (b.top+b.bottom)/2;});var t=targetIndex(centers,cur,y);if(t===cur)return;if(t>cur)list.insertBefore(dragging,rs[t].nextSibling);else list.insertBefore(dragging,rs[t]);}
 function end(){if(timer){clearTimeout(timer);timer=null;}if(!dragging)return;var order=rows().map(function(r){return r.dataset.name;});dragging=null;auto=0;if(raf){cancelAnimationFrame(raf);raf=null;}if(clone){clone.remove();clone=null;}setTimeout(function(){suppressClick=false;},80);if(JSON.stringify(order)!==JSON.stringify(startOrder))onSave(order);}
 list.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var grab=e.target.closest('.grab'),row=e.target.closest('[data-name]');if(!grab||!row||!list.contains(row))return;press(e.touches[0].clientX,e.touches[0].clientY,row);},{passive:true});
 list.addEventListener('touchmove',function(e){if(!e.touches.length)return;move(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:false});
 list.addEventListener('touchend',end,{passive:true});list.addEventListener('touchcancel',end,{passive:true});
 list.addEventListener('contextmenu',function(e){if(e.target.closest('.grab'))e.preventDefault();});
 list.addEventListener('mousedown',function(e){if(e.button!==0)return;var grab=e.target.closest('.grab'),row=e.target.closest('[data-name]');if(!grab||!row)return;press(e.clientX,e.clientY,row);var mm=function(ev){move(ev.clientX,ev.clientY,ev);};var mu=function(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);end();};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
}

function isStandalone(){try{return navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);}catch(e){return false;}}
function isIOS(){var ua=navigator.userAgent||'';return /iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);}
function storageOk(){try{var k='nextset:check';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
function notices(app){
 if(!storageOk())app.appendChild(el('div',{class:'notice warn',role:'alert'},[el('div',{class:'notice-title',text:'הדפדפן הזה חוסם שמירה'}),el('div',{class:'notice-text',text:'המשקלים לא יישמרו כאן. פתח את הקישור בסאפרי רגיל (לא בגלישה פרטית ולא בתוך אפליקציה אחרת) והוסף את האפליקציה למסך הבית.'})]));
 if(isStandalone()||S.hideInstallHint)return;
 var how=isIOS()?'בסאפרי: לוחצים על כפתור השיתוף (ריבוע עם חץ למעלה) ואז על ״הוספה למסך הבית״.':'בתפריט הדפדפן בוחרים ״הוספה למסך הבית״ או ״התקנת אפליקציה״.';
 app.appendChild(el('div',{class:'notice'},[el('div',{class:'notice-title',text:'כדאי להוסיף למסך הבית'}),el('div',{class:'notice-text',text:how+' ככה האפליקציה נפתחת כמו אפליקציה רגילה, עובדת בלי אינטרנט והנתונים נשמרים.'}),btn('הבנתי, לא להציג שוב','compact lime',function(){S.hideInstallHint=true;save();render();})]));
}
function backupSection(app){var sec=el('div',{class:'backup'});sec.appendChild(el('div',{class:'hint',text:'גיבוי: הנתונים נשמרים רק בדפדפן הזה. אפשר לייצא לקובץ ולייבא במכשיר אחר.'}));
 var file=el('input',{type:'file',accept:'application/json,.json',hidden:''});file.addEventListener('change',function(){var f=file.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(){importData(String(reader.result));};reader.readAsText(f);file.value='';});
 sec.appendChild(el('div',{class:'backup-row'},[btn('ייצוא נתונים','menu',exportData),btn('ייבוא מקובץ','menu',function(){file.click();})]));sec.appendChild(file);app.appendChild(sec);}
function exportData(){var json=JSON.stringify(S,null,1);try{var blob=new Blob([json],{type:'application/json'});var url=URL.createObjectURL(blob);var a=el('a',{href:url,download:'next-set-'+todayKey()+'.json'});document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},3000);}catch(e){}
 var ta=el('textarea',{class:'json',readonly:''});ta.value=json;dialog({title:'ייצוא נתונים',body:el('div',{class:'form'},[el('div',{class:'hint',text:'אם לא נפתחה שמירת קובץ, אפשר להעתיק את הטקסט ולשמור אותו בפתק.'}),ta]),buttons:[{label:'העתקה',onClick:function(){ta.select();try{document.execCommand('copy');toast('הועתק');}catch(e){}return false;}},{label:'סגירה'}]});}
function importData(text){var parsed;try{parsed=JSON.parse(text);}catch(e){toast('הקובץ אינו קובץ נתונים תקין');return;}if(!parsed||typeof parsed!=='object'||!parsed.records){toast('הקובץ אינו קובץ נתונים של הסט הבא');return;}
 confirmDialog('ייבוא נתונים','הנתונים בקובץ יחליפו את כל מה שנמצא כאן עכשיו.','ייבוא',function(){S=Object.assign(blank(),parsed);if(save()){selected=null;view='home';render();toast('הנתונים יובאו');}});}

document.addEventListener('visibilitychange',function(){if(!document.hidden&&!document.querySelector('.overlay'))render();});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
})();
</script>
