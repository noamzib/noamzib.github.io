var TERMS_VERSION=1,TERMS_UPDATED='גרסה 1 · 18.10.2026',TERMS=[['1. מה האפליקציה עושה','״הסט הבא״ היא כלי לתיעוד אימונים: שמירת משקלים וחזרות, טיימר מנוחה ותכנון אימונים. האפליקציה אינה ממליצה על תוכנית אימונים, על משקלים או על תרגילים. כל המידע בה מוזן על ידי המשתמש.'],['2. לא ייעוץ מקצועי או רפואי','כל מה שמופיע באפליקציה, לרבות שמות תרגילים, אייקונים, אחוזי הורדת עומס, טיימרים, גרפים ותוכניות, הוא מידע כללי בלבד. אין בו ייעוץ רפואי, פיזיותרפי, תזונתי או ייעוץ מקצועי לאימונים, והוא אינו תחליף למאמן מוסמך או לאיש מקצוע בתחום הבריאות.'],['3. התייעצות עם רופא','לפני שמתחילים תוכנית אימונים, או משנים אותה באופן משמעותי, יש להתייעץ עם רופא. הדבר חשוב במיוחד במקרים של מצב רפואי (למשל מחלת לב, לחץ דם, סוכרת או בעיות נשימה), פציעה או כאב, הריון או תקופה שאחרי לידה, ניתוח לאחרונה, נטילת תרופות קבועות, או גיל 40 ומעלה בלי פעילות גופנית סדירה.'],['4. אחריות המשתמש','האימון נעשה באחריות המשתמש בלבד. יש להקפיד על טכניקה נכונה ועל חימום, להשתמש בציוד ובמכונות בצורה תקינה ובטוחה, ולהתאמן במסגרת היכולת האישית. בכל כאב, סחרחורת, קוצר נשימה, לחץ בחזה או תחושה חריגה יש להפסיק מיד את האימון ולפנות לעזרה רפואית.'],['5. הגבלת אחריות','האפליקציה מסופקת ״כמות שהיא״ (AS IS), בלי התחייבות או אחריות מכל סוג. במידה המרבית שהדין מתיר, מפתח האפליקציה לא יישא באחריות לנזק כלשהו, ישיר או עקיף, לרבות פציעה, נזק גופני, נזק לרכוש או אובדן מידע, שנגרם מהשימוש באפליקציה, מהסתמכות על המידע שבה או מחוסר יכולת להשתמש בה.'],['6. המידע שלך והגיבוי','כל הנתונים נשמרים בטלפון בלבד ולא נשלחים לשום שרת. מפתח האפליקציה לא אוסף את המידע, לא רואה אותו ולא שומר אותו. מחיקת האפליקציה או ניקוי הנתונים שלה מוחקים את המידע לצמיתות, והגיבוי באחריות המשתמש. הודעות למפתח נשלחות רק כשהמשתמש בוחר לשלוח אותן במייל.'],['7. שירותים חיצוניים','קישורים לשירותים חיצוניים, כמו ספוטיפיי ויוטיוב, כפופים לתנאים של אותם שירותים. למפתח אין שליטה בהם ואין לו אחריות עליהם.'],['8. גיל','האפליקציה מיועדת לבני 18 ומעלה. מתחת לגיל 18 השימוש מותר רק בהסכמת הורה ובליווי של מבוגר אחראי.'],['9. שינויים בתנאים','התנאים עשויים להתעדכן בגרסאות הבאות. במקרה כזה האפליקציה תבקש לאשר אותם מחדש.'],['10. דין חל','על תנאים אלה יחולו דיני מדינת ישראל.'],['11. יצירת קשר','noamzib@gmail.com']];

function pad(n){return (n<10?'0':'')+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return dateKey(new Date());}
function sundayOf(d){var c=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);c.setDate(c.getDate()-c.getDay());return c;}
function shortDate(d){return d.getDate()+'/'+(d.getMonth()+1);}
function clamp(v,a,b){v=parseInt(v,10);if(isNaN(v))v=a;return Math.max(a,Math.min(b,v));}
function secondsLeft(deadline,now){return Math.max(0,Math.min(300,Math.ceil((deadline-now)/1000)));}
function timeText(s){return pad(Math.floor(s/60))+':'+pad(s%60);}
// Rest in 15-second steps (5.2, Noam): whole minutes as "2", the rest as minutes:seconds ("1:15", "0:45").
function minutes(sec){return sec%60===0?String(sec/60):Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function range(a,b,s){var out=[];for(var v=a;v<=b;v+=s)out.push(v);return out;}

function el(tag,props,children){var e=document.createElement(tag);if(props)for(var k in props){var v=props[k];if(v==null)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='dataset')Object.assign(e.dataset,v);else if(k==='style')e.style.cssText=v;else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}if(children)[].concat(children).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
